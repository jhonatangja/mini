<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist F RVD</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
  }
  h1 { margin: 0 0 5px; font-size: 25px; }
  .date { color: #666; margin-bottom: 20px; }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 10px;
    padding: 14px;
    margin: 8px 0;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
  }
  .task:hover { background: #f8f8f8; }
  .status {
    font-size: 20px;
    width: 24px;
    text-align: center;
  }
  .task.done {
    background: #f0faf2;
    border-color: #b8dfbf;
  }
  .task.done .name {
    text-decoration: none;
  }
  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }
  button.action {
    border: 0;
    border-radius: 10px;
    padding: 13px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
  }
  .copy { background: #128c7e; color: white; }
  .reset { background: #e9ecef; color: #333; }
  .select { background: #222; color: white; }
  textarea {
    width: 100%;
    min-height: 180px;
    margin-top: 16px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    resize: vertical;
  }
  .counter {
    margin-top: 15px;
    font-weight: bold;
    color: #555;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    background: #222;
    color: white;
    padding: 11px 18px;
    border-radius: 30px;
    display: none;
  }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>CHECKLIST F RVD</h1>
    <div class="date" id="date"></div>

    <div id="tasks"></div>

    <div class="counter" id="counter"></div>

    <div class="buttons">
      <button class="action select" onclick="selectAll()">MARCAR TODAS</button>
      <button class="action reset" onclick="resetAll()">RESETAR</button>
      <button class="action copy" onclick="copyMessage()">COPIAR WHATSAPP</button>
    </div>

    <textarea id="message" readonly></textarea>
  </div>
</div>

<div class="toast" id="toast">Mensagem copiada!</div>

<script>
const tasks = [
  "Deslacre J&T",
  "Expedição J&T",
  "Não chegou J&T",
  "Retidos J&T",
  "Sem movimentação",
  "Devolução",
  "Romaneio J&T",
  "Organização do terminal (base)",
  "Tirar foto do terminal organizado"
];

let status = new Array(tasks.length).fill(false);

function formatDate() {
  const d = new Date();
  const day = String(d.getDate()).padStart(2, "0");
  const month = String(d.getMonth() + 1).padStart(2, "0");
  return `${day}/${month}`;
}

function render() {
  document.getElementById("date").textContent = formatDate();

  const box = document.getElementById("tasks");
  box.innerHTML = "";

  tasks.forEach((task, i) => {
    const button = document.createElement("button");
    button.className = "task" + (status[i] ? " done" : "");
    button.onclick = () => toggle(i);

    button.innerHTML = `
      <span class="status">${status[i] ? "✅" : "⬜"}</span>
      <span class="name">${task}</span>
    `;

    box.appendChild(button);
  });

  const done = status.filter(Boolean).length;
  document.getElementById("counter").textContent =
    `${done} de ${tasks.length} tarefas concluídas`;

  document.getElementById("message").value = createMessage();
}

function toggle(i) {
  status[i] = !status[i];
  render();
}

function selectAll() {
  status.fill(true);
  render();
}

function resetAll() {
  status.fill(false);
  render();
}

function createMessage() {
  const date = formatDate();
  let text = `BOM DIA ${date} F RVD\nsegue o checklist do dia.\n\n`;

  tasks.forEach((task, i) => {
    text += `- ${task} ${status[i] ? "✅" : "❌"}\n`;
  });

  return text.trim();
}

async function copyMessage() {
  const text = createMessage();

  try {
    await navigator.clipboard.writeText(text);
    showToast("Mensagem copiada!");
  } catch {
    const textarea = document.getElementById("message");
    textarea.select();
    document.execCommand("copy");
    showToast("Mensagem copiada!");
  }
}

function showToast(text) {
  const toast = document.getElementById("toast");
  toast.textContent = text;
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 1800);
}

render();
</script>
</body>
</html>
